# name: 'E2E'
name: "🎭  "
description: "Localized E2E"
author: "JeromeFitz"

inputs:
  LHCI_GITHUB_APP_TOKEN:
    description: "Provide GitHub App Token for Lighthouse"
    required: true
    type: string
  TURBO_TEAM:
    description: "Provide Team ID for Turbo"
    required: true
    type: string
  TURBO_TOKEN:
    description: "Provide Token for Turbo"
    required: true
    type: string
  VERCEL_ENV:
    description: "Mock environment for Vercel / Turbo Cache"
    required: true
    type: string
    default: "preview"
  WEBSITE:
    description: "Provide Website for Lighthouse"
    required: true
    type: string
    default: "jeromefitzgerald.com"

outputs:
  lhci_performance:
    description: "Lighthouse Performance score (0-100)"
    value: ${{ steps.lhci-parse.outputs.performance }}
  lhci_accessibility:
    description: "Lighthouse Accessibility score (0-100)"
    value: ${{ steps.lhci-parse.outputs.accessibility }}
  lhci_best_practices:
    description: "Lighthouse Best Practices score (0-100)"
    value: ${{ steps.lhci-parse.outputs.best_practices }}
  lhci_seo:
    description: "Lighthouse SEO score (0-100)"
    value: ${{ steps.lhci-parse.outputs.seo }}
  lhci_report_url:
    description: "Lighthouse CI uploaded report URL"
    value: ${{ steps.lhci-parse.outputs.report_url }}

runs:
  using: "composite"
  steps:
    - name: "🎭 Playwright: Get Installed Version"
      id: playwright-version
      shell: bash
      run: echo PLAYWRIGHT_VERSION=$(node --print 'require("./packages/playwright-config/package.json").devDependencies["@playwright/test"]') >> $GITHUB_ENV

    - name: "🎭 Playwright: Check Browser Cache"
      id: playwright-cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

    - name: "🧪  Test: Build"
      id: e2e-build
      shell: bash
      env:
        TURBO_TEAM: ${{ inputs.TURBO_TEAM }}
        TURBO_TOKEN: ${{ inputs.TURBO_TOKEN }}
        VERCEL_ENV: ${{ inputs.VERCEL_ENV }}
      run: |
        pnpm turbo run build --filter="${{ inputs.WEBSITE }}" --cache-dir=".cache-turbo"

    - name: "💡  Lighthouse: ${{ inputs.WEBSITE }}"
      id: test-lighthouse
      shell: bash
      env:
        LHCI_GITHUB_APP_TOKEN: ${{ inputs.LHCI_GITHUB_APP_TOKEN }}
        TURBO_TEAM: ${{ inputs.TURBO_TEAM }}
        TURBO_TOKEN: ${{ inputs.TURBO_TOKEN }}
        VERCEL_ENV: ${{ inputs.VERCEL_ENV }}
      run: |
        pnpm turbo run lhci --filter="${{ inputs.WEBSITE }}" --cache-dir=".cache-turbo"

    - name: "💡  Lighthouse: Parse Scores"
      id: lhci-parse
      shell: bash
      run: |
        lhci_dir="sites/${{ inputs.WEBSITE }}/.lighthouseci"
        lhr=$(ls -t "$lhci_dir"/lhr-*.json 2>/dev/null | head -1)
        if [ -n "$lhr" ]; then
          LHCI_LHR="$lhr" LHCI_DIR="$lhci_dir" node -e "
            const fs = require('fs');
            const lhr = JSON.parse(fs.readFileSync(process.env.LHCI_LHR, 'utf8'));
            const cats = lhr.categories;
            const score = c => Math.round((cats[c]?.score ?? 0) * 100);
            const lines = [
              'performance=' + score('performance'),
              'accessibility=' + score('accessibility'),
              'best_practices=' + score('best-practices'),
              'seo=' + score('seo'),
            ];
            try {
              const links = JSON.parse(fs.readFileSync(process.env.LHCI_DIR + '/links.json', 'utf8'));
              const url = Object.values(links)[0] || '';
              if (url) lines.push('report_url=' + url);
            } catch {}
            process.stdout.write(lines.join('\n') + '\n');
          " >> $GITHUB_OUTPUT
        fi

    - name: "🎭  Playwright: Install (!cache)"
      id: e2e-dependencies-playwright
      shell: bash
      run: pnpm dlx playwright@${{ env.PLAYWRIGHT_VERSION }} install --with-deps
      if: steps.playwright-cache.outputs.cache-hit != 'true'

    - name: "🎭  Playwright: Install (cache)"
      id: e2e-dependencies-playwright-cache
      shell: bash
      run: pnpm dlx playwright@${{ env.PLAYWRIGHT_VERSION }} install-deps
      if: steps.playwright-cache.outputs.cache-hit == 'true'

    - name: "🎭  Playwright: ${{ inputs.WEBSITE }}"
      id: e2e-test
      shell: bash
      env:
        TURBO_TEAM: ${{ inputs.TURBO_TEAM }}
        TURBO_TOKEN: ${{ inputs.TURBO_TOKEN }}
        VERCEL_ENV: ${{ inputs.VERCEL_ENV }}
      run: pnpm turbo run test:e2e --filter="${{ inputs.WEBSITE }}" --cache-dir=".cache-turbo"

