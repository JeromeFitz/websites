name: "  ▶️  Pull"

on:
  pull_request:
    branches:
      - main
      # # prerelease
      # - canary
      # - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      # - converted_to_draft

concurrency:
  group: pull-${{ github.ref }}-1
  cancel-in-progress: true

env:
  APPLE_API: ${{ secrets.APPLE_API }}
  APPLE_AUTH_ISS: ${{ secrets.APPLE_AUTH_ISS }}
  APPLE_AUTH_KID: ${{ secrets.APPLE_AUTH_KID }}
  APPLE_IDENTIFIER: ${{ secrets.APPLE_IDENTIFIER }}
  APPLE_TOKEN_DEVELOPER: ${{ secrets.APPLE_TOKEN_DEVELOPER }}
  APPLE_TOKEN_USER: ${{ secrets.APPLE_TOKEN_USER }}
  GH_BOT_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
  GH_DEPLOY_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
  GH_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
  GOODREADS_ID: ${{ secrets.GOODREADS_ID }}
  GOODREADS_KEY: ${{ secrets.GOODREADS_KEY }}
  LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
  NEXT_PUBLIC__APPLE_IDENTIFIER: ""
  NEXT_PUBLIC__APPLE_TOKEN_DEVELOPER: ""
  NEXT_PUBLIC__FATHOM_SITE_ID: ${{ secrets.NEXT_PUBLIC__FATHOM_SITE_ID }}
  NEXT_PUBLIC__SITE: ${{ vars.NEXT_PUBLIC__SITE }}
  NEXT_TELEMETRY_DISABLED: ${{ vars.NEXT_TELEMETRY_DISABLED }}
  NOTION__DATABASE__BLOG: ${{ secrets.NOTION__DATABASE__BLOG }}
  NOTION__DATABASE__BOOKS: ${{ secrets.NOTION__DATABASE__BOOKS }}
  NOTION__DATABASE__EPISODES: ${{ secrets.NOTION__DATABASE__EPISODES }}
  NOTION__DATABASE__EVENTS: ${{ secrets.NOTION__DATABASE__EVENTS }}
  NOTION__DATABASE__PAGES: ${{ secrets.NOTION__DATABASE__PAGES }}
  NOTION__DATABASE__PEOPLE: ${{ secrets.NOTION__DATABASE__PEOPLE }}
  NOTION__DATABASE__PODCASTS: ${{ secrets.NOTION__DATABASE__PODCASTS }}
  NOTION__DATABASE__SHOWS: ${{ secrets.NOTION__DATABASE__SHOWS }}
  NOTION__DATABASE__VENUES: ${{ secrets.NOTION__DATABASE__VENUES }}
  NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  OCTOKIT_TOKEN: ${{ secrets.OCTOKIT_TOKEN }}
  OG_API_KEY: ${{ secrets.OG_API_KEY }}
  POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
  POSTGRES_SITE_ID: ${{ vars.POSTGRES_SITE_ID }}
  PREVIEW_TOKEN: ${{ secrets.PREVIEW_TOKEN }}
  REVALIDATE_TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
  UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
  VERCEL_ENV: ${{ vars.VERCEL_ENV }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  pull:
    name: "👷️  CI"
    if: ${{ github.event.pull_request.draft == false && !contains(github.event.head_commit.message, '[skip ci]') }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      APPLE_API: ${{ secrets.APPLE_API }}
      APPLE_AUTH_KID: ${{ secrets.APPLE_AUTH_KID }}
      APPLE_AUTH_ISS: ${{ secrets.APPLE_AUTH_ISS }}
      APPLE_IDENTIFIER: ${{ secrets.APPLE_IDENTIFIER }}
      APPLE_TOKEN_DEVELOPER: ${{ secrets.APPLE_TOKEN_DEVELOPER }}
      APPLE_TOKEN_USER: ${{ secrets.APPLE_TOKEN_USER }}
      GH_BOT_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
      GH_DEPLOY_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
      GOODREADS_ID: ${{ secrets.GOODREADS_ID }}
      GOODREADS_KEY: ${{ secrets.GOODREADS_KEY }}
      LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      NEXT_PUBLIC__APPLE_IDENTIFIER: ""
      NEXT_PUBLIC__APPLE_TOKEN_DEVELOPER: ""
      NEXT_PUBLIC__FATHOM_SITE_ID: ${{ secrets.NEXT_PUBLIC__FATHOM_SITE_ID }}
      NEXT_PUBLIC__SITE: ${{ vars.NEXT_PUBLIC__SITE }}
      NEXT_TELEMETRY_DISABLED: ${{ vars.NEXT_TELEMETRY_DISABLED }}
      NOTION__DATABASE__BLOG: ${{ secrets.NOTION__DATABASE__BLOG }}
      NOTION__DATABASE__BOOKS: ${{ secrets.NOTION__DATABASE__BOOKS }}
      NOTION__DATABASE__EPISODES: ${{ secrets.NOTION__DATABASE__EPISODES }}
      NOTION__DATABASE__EVENTS: ${{ secrets.NOTION__DATABASE__EVENTS }}
      NOTION__DATABASE__PAGES: ${{ secrets.NOTION__DATABASE__PAGES }}
      NOTION__DATABASE__PEOPLE: ${{ secrets.NOTION__DATABASE__PEOPLE }}
      NOTION__DATABASE__PODCASTS: ${{ secrets.NOTION__DATABASE__PODCASTS }}
      NOTION__DATABASE__SHOWS: ${{ secrets.NOTION__DATABASE__SHOWS }}
      NOTION__DATABASE__VENUES: ${{ secrets.NOTION__DATABASE__VENUES }}
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      OCTOKIT_TOKEN: ${{ secrets.OCTOKIT_TOKEN }}
      OG_API_KEY: ${{ secrets.OG_API_KEY }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      POSTGRES_SITE_ID: ${{ vars.POSTGRES_SITE_ID }}
      PREVIEW_TOKEN: ${{ secrets.PREVIEW_TOKEN }}
      REVALIDATE_TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      VERCEL_ENV: ${{ vars.VERCEL_ENV }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      IS_ACTOR_VERIFIED: ${{ github.actor == 'jeromefitz' || github.actor == 'renovate[bot]' }}
    steps:
      - name: "🐙️  Checkout"
        id: pull-checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: "💽️  Init"
        id: pull-init
        uses: ./.github/actions/init

      - name: "📦  Install"
        id: pull-install
        uses: ./.github/actions/install

      - name: "🔺️  Cache (vercel)"
        id: pull-cache-vercel
        uses: ./.github/actions/cache-turbo
        with:
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          VERCEL_ENV: ${{ vars.VERCEL_ENV }}

      - name: "🚨️  Lint"
        id: pull-lint
        uses: ./.github/actions/lint
        with:
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

      - name: "🧪  Test"
        id: pull-test
        uses: ./.github/actions/test
        with:
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

      - name: "📊  Coverage (@jeromefitz/shared)"
        id: pull-coverage-shared
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          github-token: ${{ secrets.GH_BOT_TOKEN }}
          name: "@jeromefitz/shared"
          json-final-path: packages/shared/coverage/coverage-final.json
          json-summary-path: packages/shared/coverage/coverage-summary.json
          vite-config-path: packages/shared/vitest.config.ts

      - name: "📊  Coverage (next-notion)"
        id: pull-coverage-next-notion
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          github-token: ${{ secrets.GH_BOT_TOKEN }}
          name: "next-notion"
          json-final-path: packages/next-notion/coverage/coverage-final.json
          json-summary-path: packages/next-notion/coverage/coverage-summary.json
          vite-config-path: packages/next-notion/vitest.config.ts

      - name: "📊  Coverage (jeromefitzgerald.com)"
        id: pull-coverage-site
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          github-token: ${{ secrets.GH_BOT_TOKEN }}
          name: "jeromefitzgerald.com"
          json-final-path: sites/jeromefitzgerald.com/coverage/coverage-final.json
          json-summary-path: sites/jeromefitzgerald.com/coverage/coverage-summary.json
          vite-config-path: sites/jeromefitzgerald.com/vitest.config.ts

      # https://docs.github.com/en/actions/learn-github-actions/expressions
      - name: "📛  Commit Message"
        id: pull-commit-message
        run: |
          echo "message=$(git log --no-merges -1 --oneline)" >> $GITHUB_OUTPUT

      - name: "🎭  E2E"
        id: pull-e2e
        if: ${{ contains(steps.pull-commit-message.outputs.message, '[b]') }}
        uses: ./.github/actions/e2e
        with:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          VERCEL_ENV: ${{ vars.VERCEL_ENV }}
          WEBSITE: "jeromefitzgerald.com"

      - name: "🔺️  Deploy (Preview)"
        id: pull-deploy-preview
        if: ${{ (env.IS_ACTOR_VERIFIED == 'true') && contains(steps.pull-commit-message.outputs.message, '[b]') }}
        uses: ./.github/actions/deploy
        with:
          GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PRODUCTION: false
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
