  undici@^6.0.0: ^6.27.0
  undici@^7.0.0: ^7.28.0
  ws@^8.0.0: ^8.20.0
packages:
  - "config/*"
  - "packages/*"
  - "sites/*"
  - "!sites/jerandky.com/*"
patchedDependencies:
  "@semantic-release/commit-analyzer@13.0.1": patches/@semantic-release__commit-analyzer@13.0.0.patch
  next: patches/next.patch
publicHoistPattern:
  - "*ccommit*"
  - "*eslint*"
  - "*lint-staged*"
  - "*playwright*"
  - "*oxfmt*"
  - "*oxlint*"
  - "*semantic*"
  - "*testing-library*"
  - "*types*"
registry: https://registry.npmjs.org/
saveExact: true
strictPeerDependencies: false
tagVersionPrefix: ""
